packages:
  - .

# Published DSH packages require their own peers for Node-based development tests.
# This workspace setting is not shipped; the adapter's host peers remain optional.
autoInstallPeers: true

allowBuilds:
  esbuild: true
  koffi: true
  fs-ext: true
  node-pty: true
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  protobufjs: false
