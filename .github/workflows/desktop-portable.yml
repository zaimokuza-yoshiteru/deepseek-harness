name: Desktop portable

on:
  push:
    branches: [desktop]
  workflow_dispatch:
    inputs:
      version:
        description: Optional desktop build version (defaults to delivery.json)
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            shell: bash
            script: package:portable:mac:arm64
          - target: win-x64
            runner: windows-2025
            shell: pwsh
            script: package:portable:win:x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      DSH_TELEMETRY_MODE: DISABLED
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - name: Resolve delivery version
        env:
          DSH_REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
          import { appendFileSync, readFileSync } from "node:fs"
          const config = JSON.parse(readFileSync("delivery.json", "utf8"))
          const version = process.env.DSH_REQUESTED_VERSION || config.version
          if (!/^[0-9]+(\.[A-Za-z0-9-]+)+$/.test(version)) throw new Error(`Invalid delivery version: ${version}`)
          appendFileSync(process.env.GITHUB_ENV, `DSH_DESKTOP_DISTRIBUTION_VERSION=${version}\n`)
          '
      - name: Verify tag and source branch
        run: node apps/desktop/scripts/verify-portable-tag.mjs
      - uses: pnpm/action-setup@v4
      - name: Build and test as a standard Windows user
        if: runner.os == 'Windows'
        run: ./apps/desktop/scripts/ci-standard-user-windows.ps1
      - name: Build and test as a standard macOS user
        if: runner.os == 'macOS'
        run: bash apps/desktop/scripts/ci-standard-user-macos.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/standard-user-*.json
          if-no-files-found: error
          compression-level: 0
      - name: Upload macOS GUI startup evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-mac-arm64
          path: |
            .artifacts/startup-timing/result.json
            .artifacts/startup-timing/*.png
            .artifacts/startup-timing/launch-error.txt
          if-no-files-found: warn

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - name: Resolve delivery version
        env:
          DSH_REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
          import { appendFileSync, readFileSync } from "node:fs"
          const config = JSON.parse(readFileSync("delivery.json", "utf8"))
          const version = process.env.DSH_REQUESTED_VERSION || config.version
          if (!/^[0-9]+(\.[A-Za-z0-9-]+)+$/.test(version)) throw new Error(`Invalid delivery version: ${version}`)
          appendFileSync(process.env.GITHUB_ENV, `DSH_DESKTOP_DISTRIBUTION_VERSION=${version}\n`)
          '
      - uses: pnpm/action-setup@v4
      - name: Install source build tools
        run: pnpm install --frozen-lockfile
      - name: Package complete source
        run: node scripts/package-source.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-source
          path: |
            .artifacts/delivery/${{ env.DSH_DESKTOP_DISTRIBUTION_VERSION }}/dsh-source-${{ env.DSH_DESKTOP_DISTRIBUTION_VERSION }}.tar.gz
            .artifacts/delivery/${{ env.DSH_DESKTOP_DISTRIBUTION_VERSION }}/dsh-source-${{ env.DSH_DESKTOP_DISTRIBUTION_VERSION }}.tar.gz.manifest.json
            .artifacts/delivery/${{ env.DSH_DESKTOP_DISTRIBUTION_VERSION }}/dsh-source-${{ env.DSH_DESKTOP_DISTRIBUTION_VERSION }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
