name: Desktop portable

on:
  push:
    branches: [desktop]
    tags: ['0.1.7.alpha.1.*']
  workflow_dispatch:
    inputs:
      version:
        description: Desktop build version (manual runs upload artifacts only)
        required: true
        default: '0.1.7.alpha.1.1'

permissions:
  contents: read

concurrency:
  group: desktop-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            shell: bash
            script: package:portable:mac:arm64
          - target: win-x64
            runner: windows-2025
            shell: pwsh
            script: package:portable:win:x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      DSH_DESKTOP_DISTRIBUTION_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '0.1.7.alpha.1.1' }}
      DSH_TELEMETRY_MODE: DISABLED
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - name: Verify tag and source branch
        run: node apps/desktop/scripts/verify-portable-tag.mjs
      - uses: pnpm/action-setup@v4
      - name: Build and test as a standard Windows user
        if: runner.os == 'Windows'
        run: ./apps/desktop/scripts/ci-standard-user-windows.ps1
      - name: Build and test as a standard macOS user
        if: runner.os == 'macOS'
        run: bash apps/desktop/scripts/ci-standard-user-macos.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/standard-user-*.json
          if-no-files-found: error
          compression-level: 0
      - name: Upload macOS GUI startup evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-mac-arm64
          path: |
            .artifacts/startup-timing/result.json
            .artifacts/startup-timing/*.png
            .artifacts/startup-timing/launch-error.txt
          if-no-files-found: warn

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Publish application assets only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd artifacts
          sha256sum ./*.zip > SHA256SUMS.txt
          if ! gh release view "$DESKTOP_TAG" >/dev/null 2>&1; then
            gh release create "$DESKTOP_TAG" --verify-tag --prerelease --title "DSH Desktop $DESKTOP_TAG" --notes "DSH 0.1.7-alpha.1 (matching the pinned ACP peer dependencies) + ACP adapter 0.1.7-alpha.1.1 + Agent Teams Office 0.1.0-beta.3; Agent Teams enabled by default and managed by the native plugin manager. Extract the complete ZIP before opening. macOS arm64 uses ad-hoc signing without notarization; Windows x64 is unsigned. No npm package is published."
          fi
          gh release upload "$DESKTOP_TAG" ./*.zip SHA256SUMS.txt --clobber
