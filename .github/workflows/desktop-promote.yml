name: Desktop release promotion

on:
  # Register this workflow from the desktop branch without changing the default branch.
  push:
    branches: [desktop]
    paths: ['.github/workflows/desktop-promote.yml']
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful full Desktop portable run ID (enable macOS and source for a manual run)
        required: true
        type: string
      tag:
        description: Existing desktop tag at the verified run commit
        required: true
        type: string
      release_id:
        description: Existing draft release ID (required only for rc26-transfer)
        required: false
        type: string
      mode:
        description: Promotion mode; rc26-transfer is restricted to one verified Windows artifact
        required: true
        type: choice
        options: [full, rc26-transfer]
        default: full

permissions:
  contents: read

concurrency:
  group: desktop-promote-${{ inputs.mode }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && github.ref == 'refs/heads/desktop'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
      DESKTOP_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the source run and tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$DESKTOP_TAG" =~ ^[0-9]+(\.[A-Za-z0-9-]+)+$ ]]
          SOURCE_SHA="$(git rev-parse "refs/tags/$DESKTOP_TAG^{commit}")"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/desktop
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > /tmp/source-run.json
          export SOURCE_SHA
          python3 - <<'PY'
          import json, os
          run = json.load(open('/tmp/source-run.json'))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['event'] in ['push', 'workflow_dispatch'] and run['head_branch'] == 'desktop'
          assert run['path'] == '.github/workflows/desktop-portable.yml'
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          PY
          printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          pattern: dsh-*
          path: artifacts
          merge-multiple: true
      - name: Verify source, application metadata, and plugin digests; prepare a draft Release
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, posixpath, re, ssl, tarfile, zipfile

          tag = os.environ['DESKTOP_TAG']
          source_sha = os.environ['SOURCE_SHA']
          source_archive = f'dsh-source-{tag}.tar.gz'
          expected_zips = {f'dsh-desktop-{tag}-{target}.zip' for target in ['mac-arm64', 'win-x64']}
          assert {p.name for p in pathlib.Path('.').glob('*.zip')} == expected_zips
          assert pathlib.Path(source_archive).is_file()
          sidecar = pathlib.Path(source_archive + '.sha256').read_text().split()
          assert len(sidecar) == 2 and sidecar[1] == source_archive
          assert hashlib.sha256(pathlib.Path(source_archive).read_bytes()).hexdigest() == sidecar[0]

          with tarfile.open(source_archive, 'r:gz') as tar:
              payload = {}
              root = f'dsh-source-{tag}/'
              tar_members = tar.getmembers()
              for item in tar_members:
                  name = item.name.removeprefix('./')
                  if item.isdir() and name.rstrip('/') == root.rstrip('/'):
                      continue
                  assert name.startswith(root) and '..' not in pathlib.PurePosixPath(name).parts
                  assert item.isfile() or item.isdir() or item.issym(), (name, item.type)
                  relative = name[len(root):].rstrip('/')
                  if item.isfile() or item.issym():
                      payload[relative] = item
              for relative, item in payload.items():
                  if item.issym():
                      assert not item.linkname.startswith('/')
                      target = posixpath.normpath(posixpath.join(posixpath.dirname(relative), item.linkname))
                      assert target != '..' and not target.startswith('../') and target in payload
              def payload_bytes(path, visiting=()):
                  assert path not in visiting, f'source symlink cycle: {path}'
                  item = payload[path]
                  if item.isfile():
                      return tar.extractfile(item).read()
                  target = posixpath.normpath(posixpath.join(posixpath.dirname(path), item.linkname))
                  assert target in payload and not target.startswith('../')
                  return payload_bytes(target, (*visiting, path))
              members = {path: payload_bytes(path) for path in payload}
          source_manifest_bytes = members['source-files.json']
          assert source_manifest_bytes == pathlib.Path(source_archive + '.manifest.json').read_bytes()
          source_manifest = json.loads(source_manifest_bytes)
          assert source_manifest['commit'] == source_sha
          assert source_manifest['distributionVersion'] == tag
          payload_kind = source_manifest.get('payloadKind', 'with-tests')
          assert payload_kind in ['buildable', 'with-tests']
          assert source_manifest['testsIncluded'] is (payload_kind == 'with-tests')
          manifest_paths = {entry['path'] for entry in source_manifest['files']}
          assert manifest_paths == set(members) - {'source-files.json'}
          for entry in source_manifest['files']:
              assert not pathlib.PurePosixPath(entry['path']).is_absolute() and '..' not in pathlib.PurePosixPath(entry['path']).parts
              assert entry['path'] in members
              assert hashlib.sha256(members[entry['path']]).hexdigest() == entry['sha256'], entry['path']
              if 'payloadKind' in source_manifest or 'mode' in entry:
                  assert type(entry.get('mode')) is int and 0 <= entry['mode'] <= 0o777, entry['path']
                  assert payload[entry['path']].mode & 0o777 == entry['mode'], entry['path']

          if 'filteredPayloadSha256' in source_manifest:
              payload_digest = hashlib.sha256()
              for path in sorted(manifest_paths - {'source-revision.json'}):
                  data = members[path]
                  payload_digest.update(f'{len(path.encode())}:{path}{len(data)}:'.encode())
                  payload_digest.update(data)
              assert payload_digest.hexdigest() == source_manifest['filteredPayloadSha256']

          excluded = {'node_modules', 'lib', 'dist', '.local', '.git', '.cache', '.typert', '.DS_Store'}
          def source_digest(source):
              assert source.startswith('third_party/plugins/') and '..' not in pathlib.PurePosixPath(source).parts
              source_root = pathlib.Path('..', source)
              assert source_root.is_dir()
              files = []
              for path in source_root.rglob('*'):
                  relative = path.relative_to(source_root).as_posix()
                  parts = pathlib.PurePosixPath(relative).parts
                  if any(part in excluded for part in parts) or relative.endswith('.tsbuildinfo'):
                      continue
                  assert not path.is_symlink(), relative
                  if path.is_file():
                      files.append((relative, path.read_bytes()))
              assert files, source
              digest = hashlib.sha256()
              for path, data in sorted(files, key=lambda item: item[0]):
                  digest.update(f'{len(path.encode())}:{path}{len(data)}:'.encode())
                  digest.update(data)
              return digest.hexdigest()

          if payload_kind == 'buildable':
              full_records = source_manifest['sourcesJsonFullPluginSha256']
              checkout_records = json.load(open('../third_party/plugins/sources.json'))['plugins']
              expected_records = [{key: plugin[key] for key in ['name', 'source', 'version', 'sourceSha256']} for plugin in checkout_records]
              assert full_records == expected_records
              for plugin in full_records:
                  assert source_digest(plugin['source']) == plugin['sourceSha256'], plugin['name']

          for archive_name in sorted(expected_zips):
              target = 'mac-arm64' if 'mac-arm64' in archive_name else 'win-x64'
              evidence = json.load(open(f'standard-user-{target}.json'))
              assert evidence['target'] == target and evidence['version'] == tag
              assert evidence['standardUser'] is True and evidence['packagedSmoke'] == 'passed'
              assert evidence['archive'] == archive_name
              with open(archive_name, 'rb') as source:
                  assert hashlib.file_digest(source, 'sha256').hexdigest() == evidence['sha256']
              with zipfile.ZipFile(archive_name) as archive:
                  assert archive.testzip() is None
                  paths = archive.namelist()
                  for path in paths:
                      assert pathlib.PurePosixPath(path).name not in ['.npmrc', '.env'] and '/.git/' not in path, path
                      if not re.search(r'\.(?:pem|key|p12|pfx)$', path, re.I):
                          continue
                      # pip requires its bundled public CA certificates for HTTPS verification.
                      assert re.search(r'/runtime/primary-runtime/dependencies/python/(?:lib/python[0-9]+\.[0-9]+|Lib)/site-packages/pip/_vendor/certifi/cacert\.pem$', path), path
                      certificate_text = archive.read(path).decode('ascii')
                      without_comments = re.sub(r'^#[^\n]*', '', certificate_text, flags=re.M).strip()
                      certificates = re.findall(r'-----BEGIN CERTIFICATE-----[A-Za-z0-9+/=\s]+-----END CERTIFICATE-----', without_comments)
                      assert certificates and not re.sub(r'-----BEGIN CERTIFICATE-----[A-Za-z0-9+/=\s]+-----END CERTIFICATE-----', '', without_comments).strip(), path
                      ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT).load_verify_locations(cadata='\n'.join(certificates))
                      print('Verified public CA bundle', path, hashlib.sha256(archive.read(path)).hexdigest())
                  metadata = [p for p in paths if p.endswith('/plugin-seed/package.json')]
                  assert len(metadata) == 1
                  prefix = metadata[0][:-len('package.json')]
                  manifest = json.loads(archive.read(metadata[0]))
                  plugin_manifest_path = prefix + 'desktop-plugin-build.json'
                  plugin_manifest = json.loads(archive.read(plugin_manifest_path))
                  plugins = plugin_manifest['plugins']
                  assert plugins
                  configured = {plugin['name']: plugin['source'] for plugin in json.load(open('../apps/desktop/src/release-plugins.json'))['plugins'] if plugin.get('desktopBundle', True)}
                  assert {plugin['name'] for plugin in plugins} == set(configured)
                  names = set()
                  for plugin in plugins:
                      for field in ['name', 'version', 'source', 'asset', 'sha256', 'sourceSha256']:
                          assert isinstance(plugin.get(field), str) and plugin[field], (field, plugin)
                      assert re.fullmatch(r'[0-9a-f]{64}', plugin['sha256'])
                      assert re.fullmatch(r'[0-9a-f]{64}', plugin['sourceSha256'])
                      assert plugin['name'] not in names
                      assert plugin['source'] == configured[plugin['name']]
                      names.add(plugin['name'])
                      packed = archive.read(prefix + 'desktop-local-plugins/' + plugin['asset'])
                      assert hashlib.sha256(packed).hexdigest() == plugin['sha256'], plugin['name']
                      with tarfile.open(fileobj=io.BytesIO(packed), mode='r:gz') as plugin_tar:
                          package_manifest = json.load(plugin_tar.extractfile('package/package.json'))
                      assert package_manifest['name'] == plugin['name']
                      assert package_manifest['version'] == plugin['version']
                      assert source_digest(plugin['source']) == plugin['sourceSha256'], plugin['name']
                      assert manifest['dependencies'][plugin['name']] == 'file:./desktop-local-plugins/' + plugin['asset']
                  assert set(manifest['dependencies']) == names
                  assert '@zaimokuza/dsh-plugin-hub' not in manifest['dependencies']
                  assert '@deepseek-ai/dsh-experimental-agent-team-profile' in manifest['dsh']['profile']['bundles']
                  assert '@deepseek-ai/dsh-experimental-agent-team-web-profile' not in manifest['dsh']['profile']['bundles']
              print('Verified', archive_name)
          PY
          sha256sum ./*.zip ./*.tar.gz ./*.manifest.json ./*.sha256 > SHA256SUMS.txt
          if gh release view "$DESKTOP_TAG" --json isDraft > /tmp/release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/release.json"))["isDraft"] is True'
          else
            gh release create "$DESKTOP_TAG" --verify-tag --draft --prerelease --title "DSH Desktop $DESKTOP_TAG" --notes "Verified source and application artifacts; release review pending."
          fi
          gh release upload "$DESKTOP_TAG" ./*.zip ./*.tar.gz ./*.manifest.json ./*.sha256 SHA256SUMS.txt --clobber

  rc26-transfer:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rc26-transfer' && github.ref == 'refs/heads/codex/rc26-transfer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
      DESKTOP_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      EXPECTED_BUILD_SHA: 23072715fd7c7915c0376786e96bd6816d8e1e33
      EXPECTED_SOURCE_SHA: 21559c6d31d022aceb8dbc082008fe2e4d3274d9
      EXPECTED_RELEASE_ID: '407045112'
      EXPECTED_WRAPPER_SHA256: ecf7218ac86071263d0bd81e7ef12379f07a85293bd78c7fa9765151df4359e1
      EXPECTED_WRAPPER_BYTES: '417549686'
      EXPECTED_WINDOWS_ZIP_SHA256: 84f406e24c43e088ae5f29983406e4ba2c6e6ecddc68f5446dc0c64b7e70337f
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the fixed transfer run, source tag, and existing draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/codex/rc26-transfer ]]
          [[ "$SOURCE_RUN" == 37803157225 ]]
          [[ "$DESKTOP_TAG" == 0.2.0.rc.2.6 ]]
          [[ "$RELEASE_ID" == "$EXPECTED_RELEASE_ID" ]]
          TAG_SHA="$(git rev-parse "refs/tags/$DESKTOP_TAG^{commit}")"
          [[ "$TAG_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          DIFF="$(git diff --name-status "$EXPECTED_BUILD_SHA" "$EXPECTED_SOURCE_SHA")"
          [[ "$DIFF" == $'M\tscripts/export-source.mjs' ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-before.json"
          export SOURCE_RUN_FILE="$RUNNER_TEMP/source-run.json"
          export RELEASE_FILE="$RUNNER_TEMP/release-before.json"
          python3 - <<'PY'
          import json, os
          run = json.load(open(os.environ['SOURCE_RUN_FILE']))
          assert run['id'] == 37803157225
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == os.environ['EXPECTED_BUILD_SHA']
          assert run['event'] in ['push', 'workflow_dispatch']
          assert run['head_branch'] == 'codex/builtin-desktop-plugins'
          assert run['path'] == '.github/workflows/desktop-portable.yml'
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          release = json.load(open(os.environ['RELEASE_FILE']))
          assert str(release['id']) == os.environ['EXPECTED_RELEASE_ID']
          assert release['tag_name'] == '0.2.0.rc.2.6'
          assert release['draft'] is True and release['prerelease'] is True
          assert release['target_commitish'] == os.environ['EXPECTED_SOURCE_SHA']
          PY

      - name: Verify the single Windows artifact wrapper from the successful run
        id: windows-artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" > "$RUNNER_TEMP/windows-artifacts.json"
          export ARTIFACTS_FILE="$RUNNER_TEMP/windows-artifacts.json"
          python3 - <<'PY'
          import json, os
          artifacts = json.load(open(os.environ['ARTIFACTS_FILE']))['artifacts']
          matches = [item for item in artifacts if item['name'] == 'dsh-desktop-win-x64']
          assert len(matches) == 1
          artifact = matches[0]
          assert artifact['digest'] == 'sha256:' + os.environ['EXPECTED_WRAPPER_SHA256']
          assert artifact['size_in_bytes'] == int(os.environ['EXPECTED_WRAPPER_BYTES'])
          assert artifact['expired'] is False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"artifact_id={artifact['id']}\n")
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f"WINDOWS_ARTIFACT_ID={artifact['id']}\n")
          PY

      - name: Download and validate the Windows wrapper, ZIP, and runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming evidence
          gh api "repos/$GH_REPO/actions/artifacts/${{ steps.windows-artifact.outputs.artifact_id }}/zip" > incoming/windows-artifact.zip
          printf '%s  %s\n' "$EXPECTED_WRAPPER_SHA256" incoming/windows-artifact.zip | sha256sum --check
          python3 - <<'PY'
          import hashlib, json, os, pathlib, posixpath, re, shutil, zipfile

          incoming = pathlib.Path('incoming')
          wrapper = incoming / 'windows-artifact.zip'
          assert wrapper.stat().st_size == int(os.environ['EXPECTED_WRAPPER_BYTES'])
          expected_zip = 'dsh-desktop-0.2.0.rc.2.6-win-x64.zip'
          expected_receipt = 'standard-user-win-x64.json'
          with zipfile.ZipFile(wrapper) as archive:
              assert archive.testzip() is None
              infos = archive.infolist()
              assert {item.filename for item in infos} == {expected_zip, expected_receipt}
              assert all(not item.is_dir() and '/' not in item.filename and chr(92) not in item.filename for item in infos)
              for name in [expected_zip, expected_receipt]:
                  with archive.open(name) as source, (incoming / name).open('wb') as destination:
                      shutil.copyfileobj(source, destination)

          windows_zip = incoming / expected_zip
          with windows_zip.open('rb') as source:
              windows_sha = hashlib.file_digest(source, 'sha256').hexdigest()
          assert windows_sha == os.environ['EXPECTED_WINDOWS_ZIP_SHA256']
          standard = json.loads((incoming / expected_receipt).read_text())
          assert standard['target'] == 'win-x64'
          assert standard['version'] == '0.2.0.rc.2.6'
          assert standard['standardUser'] is True
          assert standard['build'] == 'passed' and standard['packagedSmoke'] == 'passed'
          assert standard['archive'] == expected_zip and standard['sha256'] == windows_sha

          expected_plugins = {
              '@zaimokuza/dsh-acp-adapter': ('0.2.0-rc.2.7', 'third_party/plugins/dsh-acp-adapter', '866ed658fc0b8ffea79ae460bd4099bbc8de087ce360e84309f6ef1250c23230'),
              '@zaimokuza/dsh-agent-teams-office': ('0.1.0-beta.9', 'third_party/plugins/dsh-agent-teams-office', '30294202e5055a5345166ec865c0f0226226fcfa4e798ee95d3a36c846263118'),
              'dsh-boot-ocbc': ('0.1.8', 'third_party/plugins/dsh-boot-ocbc', 'adf448f1a3f1e37659945faa1c8e5084a8baa3caa2007a72e062563d6231fa10'),
              'dsh-atlassian-kanban': ('0.1.0-alpha.10', 'third_party/plugins/dsh-atlassian-kanban', '2621d8f02edd42ac7127f687fd92618f3cb97a1ad44744eef1f0d1813c52c9fa'),
          }
          with zipfile.ZipFile(windows_zip) as archive:
              assert archive.testzip() is None
              paths = archive.namelist()
              manifests = [path for path in paths if path.lower().endswith('resources/dsh/desktop-plugin-build.json')]
              assert len(manifests) == 1, manifests
              manifest_path = manifests[0]
              assert 'app.asar' not in manifest_path
              runtime_root = manifest_path[:-len('desktop-plugin-build.json')]
              manifest = json.loads(archive.read(manifest_path))
              plugins = manifest['plugins']
              actual = {plugin['name']: plugin for plugin in plugins}
              assert len(actual) == len(plugins) == len(expected_plugins)
              assert set(actual) == set(expected_plugins)
              for name, (version, source, source_sha) in expected_plugins.items():
                  plugin = actual[name]
                  assert plugin['version'] == version
                  assert plugin['source'] == source
                  assert plugin['sourceSha256'] == source_sha
                  assert re.fullmatch(r'[0-9a-f]{64}', plugin['sha256'])
                  assert plugin['asset'].endswith('.tgz')
              pathlib.Path('evidence/runtime-plugin-provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')

              def export_targets(value):
                  if isinstance(value, str):
                      return [value]
                  if isinstance(value, dict):
                      return [target for item in value.values() for target in export_targets(item)]
                  if isinstance(value, list):
                      return [target for item in value for target in export_targets(item)]
                  return []

              installed_payloads = []
              for name, (version, _, _) in expected_plugins.items():
                  package_root = runtime_root + 'node_modules/' + name + '/'
                  package_path = package_root + 'package.json'
                  assert package_path in paths, f'missing installed plugin manifest: {name}'
                  package_bytes = archive.read(package_path)
                  package = json.loads(package_bytes)
                  assert package['name'] == name and package['version'] == version
                  patch_path = package.get('dsh', {}).get('bundle', {}).get('patch')
                  assert isinstance(patch_path, str) and patch_path.startswith('./')
                  patch_path = package_root + patch_path[2:]
                  assert patch_path in paths, f'missing installed bundle patch: {name}'
                  declared = [package.get('main'), *export_targets(package.get('exports'))]
                  entrypoints = []
                  for target in declared:
                      if not isinstance(target, str) or not target.startswith('./') or '*' in target:
                          continue
                      if not target.endswith(('.js', '.mjs', '.cjs')):
                          continue
                      path = package_root + target[2:]
                      assert path in paths, f'missing installed plugin entrypoint: {name}:{target}'
                      content = archive.read(path)
                      entrypoints.append({'path': path, 'sha256': hashlib.sha256(content).hexdigest(), 'bytes': len(content)})
                  assert entrypoints, f'plugin has no installed JavaScript entrypoint: {name}'
                  patch_bytes = archive.read(patch_path)
                  installed_payloads.append({
                      'name': name,
                      'version': package['version'],
                      'packageManifest': {'path': package_path, 'sha256': hashlib.sha256(package_bytes).hexdigest()},
                      'entrypoints': entrypoints,
                      'bundlePatch': {'path': patch_path, 'sha256': hashlib.sha256(patch_bytes).hexdigest()},
                  })
              pathlib.Path('evidence/runtime-installed-plugin-payload.json').write_text(json.dumps(installed_payloads, indent=2) + '\n')

              runtime_paths = set(paths)
              seeds = [path for path in paths if '/plugin-seed/' in path]
              assert not seeds, seeds
              starts = [
                  runtime_root + 'node_modules/@deepseek-ai/dsh-app-boot/lib/index.js',
                  runtime_root + 'node_modules/@deepseek-ai/dsh/lib/profile-boot.js',
                  runtime_root + 'node_modules/dsh-boot-ocbc/lib/client.js',
              ]
              closure = set()
              pending = list(starts)
              import_pattern = re.compile(rb'''(?:\bfrom\s*|\bimport\s*\(|\brequire\s*\()\s*["'](\.[^"']+)["']''')
              while pending:
                  path = pending.pop()
                  if path in closure:
                      continue
                  assert path in runtime_paths, f'missing runtime closure file: {path}'
                  closure.add(path)
                  source_bytes = archive.read(path)
                  for match in import_pattern.finditer(source_bytes):
                      specifier = match.group(1).decode('utf-8')
                      base = posixpath.normpath(posixpath.join(posixpath.dirname(path), specifier))
                      candidates = [base] if posixpath.splitext(base)[1] else [base + suffix for suffix in ('.js', '.mjs', '.cjs')]
                      candidates += [base + '/index.js']
                      resolved = next((candidate for candidate in candidates if candidate in runtime_paths), None)
                      if posixpath.splitext(base)[1] in ('.js', '.mjs', '.cjs'):
                          assert resolved is not None, f'missing relative JavaScript import from {path}: {specifier}'
                      if resolved:
                          pending.append(resolved)
              closure_records = []
              digest = hashlib.sha256()
              for path in sorted(closure):
                  content = archive.read(path)
                  relative_path = path[len(runtime_root):]
                  digest.update(f'{len(relative_path.encode())}:{relative_path}{len(content)}:'.encode())
                  digest.update(content)
                  closure_records.append({'path': relative_path, 'sha256': hashlib.sha256(content).hexdigest(), 'bytes': len(content)})
              playback_extensions = {'.js', '.png', '.webp', '.jpg', '.jpeg', '.svg', '.woff', '.woff2', '.ttf', '.otf', '.css', '.webm', '.mp4', '.gif'}
              ocbc_root = runtime_root + 'node_modules/dsh-boot-ocbc/'
              ocbc_files = []
              for path in sorted(paths):
                  if not path.startswith(ocbc_root) or pathlib.PurePosixPath(path).suffix.lower() not in playback_extensions:
                      continue
                  content = archive.read(path)
                  ocbc_files.append({
                      'path': 'dsh/node_modules/dsh-boot-ocbc/' + path[len(ocbc_root):],
                      'bytes': len(content),
                      'sha256': hashlib.sha256(content).hexdigest(),
                  })
              assert len(ocbc_files) == 118, f'Unexpected OCBC playback file count: {len(ocbc_files)}'
              assert sum(item['bytes'] for item in ocbc_files) == 23193767, 'OCBC playback byte size differs from the verified macOS archive'
              closure_report = {
                  'schemaVersion': 1,
                  'resourceRoot': runtime_root,
                  'entrypoints': [path[len(runtime_root):] for path in starts],
                  'files': closure_records,
                  'sha256': digest.hexdigest(),
                  'ocbcPlaybackFiles': ocbc_files,
              }
              pathlib.Path('evidence/runtime-closure-fingerprint.json').write_text(json.dumps(closure_report, indent=2) + '\n')

          with wrapper.open('rb') as source:
              wrapper_sha = hashlib.file_digest(source, 'sha256').hexdigest()
          pathlib.Path('evidence/standard-user-win-x64.json').write_text(json.dumps(standard, indent=2) + '\n')
          receipt = {
              'schemaVersion': 1,
              'runId': int(os.environ['SOURCE_RUN']),
              'runHeadSha': os.environ['EXPECTED_BUILD_SHA'],
              'sourceTag': os.environ['DESKTOP_TAG'],
              'tagCommitSha': os.environ['EXPECTED_SOURCE_SHA'],
              'releaseId': int(os.environ['RELEASE_ID']),
              'wrapper': {'artifactId': int(os.environ['WINDOWS_ARTIFACT_ID']), 'artifactName': 'dsh-desktop-win-x64',
                          'apiDigest': 'sha256:' + os.environ['EXPECTED_WRAPPER_SHA256'],
                          'sha256': wrapper_sha, 'bytes': wrapper.stat().st_size},
              'windows': {'archive': expected_zip, 'sha256': windows_sha, 'bytes': windows_zip.stat().st_size, 'crc': 'passed'},
              'standardUser': standard,
              'runtimePlugins': [{'name': item['name'], 'version': item['version'], 'sourceSha256': item['sourceSha256']} for item in plugins],
              'installedPluginPayloadCount': len(installed_payloads),
              'runtimeClosureSha256': closure_report['sha256'],
          }
          pathlib.Path('evidence/transfer-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({'wrapperSha256': wrapper_sha, 'wrapperBytes': wrapper.stat().st_size,
                            'windowsSha256': windows_sha, 'windowsBytes': windows_zip.stat().st_size,
                            'pluginCount': len(plugins), 'runtimeClosureSha256': closure_report['sha256']}))
          PY

      - name: Recheck the draft and upload only the verified Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-before-upload.json"
          export RELEASE_FILE="$RUNNER_TEMP/release-before-upload.json"
          python3 - <<'PY'
          import json, os
          release = json.load(open(os.environ['RELEASE_FILE']))
          assert str(release['id']) == os.environ['EXPECTED_RELEASE_ID']
          assert release['tag_name'] == '0.2.0.rc.2.6'
          assert release['draft'] is True and release['prerelease'] is True
          assert release['target_commitish'] == os.environ['EXPECTED_SOURCE_SHA']
          assert not any(asset['name'] == 'dsh-desktop-0.2.0.rc.2.6-win-x64.zip' for asset in release['assets'])
          PY
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/zip' \
            --data-binary '@incoming/dsh-desktop-0.2.0.rc.2.6-win-x64.zip' \
            "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=dsh-desktop-0.2.0.rc.2.6-win-x64.zip" \
            > "$RUNNER_TEMP/uploaded-asset.json"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-after-upload.json"
          export UPLOADED_ASSET_FILE="$RUNNER_TEMP/uploaded-asset.json"
          export RELEASE_FILE="$RUNNER_TEMP/release-after-upload.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          uploaded = json.load(open(os.environ['UPLOADED_ASSET_FILE']))
          release = json.load(open(os.environ['RELEASE_FILE']))
          assert str(release['id']) == os.environ['EXPECTED_RELEASE_ID']
          assert release['tag_name'] == '0.2.0.rc.2.6'
          assert release['draft'] is True and release['prerelease'] is True
          assert release['target_commitish'] == os.environ['EXPECTED_SOURCE_SHA']
          matches = [asset for asset in release['assets'] if asset['name'] == 'dsh-desktop-0.2.0.rc.2.6-win-x64.zip']
          assert len(matches) == 1
          asset = matches[0]
          path = pathlib.Path('incoming/dsh-desktop-0.2.0.rc.2.6-win-x64.zip')
          with path.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          assert uploaded['id'] == asset['id']
          assert uploaded['size'] == asset['size'] == path.stat().st_size
          assert asset['digest'] == 'sha256:' + digest
          evidence = pathlib.Path('evidence/transfer-receipt.json')
          receipt = json.loads(evidence.read_text())
          receipt['uploadedAsset'] = {'id': asset['id'], 'name': asset['name'], 'digest': asset['digest'], 'size': asset['size']}
          evidence.write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt['uploadedAsset']))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-rc26-windows-transfer-evidence
          path: evidence/
          if-no-files-found: warn
          include-hidden-files: true
