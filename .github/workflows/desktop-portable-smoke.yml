name: Desktop portable smoke replay

on:
  push:
    branches: [desktop]
    paths: [.github/workflows/desktop-portable-smoke.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run containing the application artifact
        required: true
      target:
        description: Application platform
        type: choice
        options: [win-x64, mac-arm64]
        default: win-x64
        required: true
      mode:
        description: GUI startup check or full packaged backend smoke
        type: choice
        options: [gui, backend]
        default: gui
        required: true
      dependency_audit:
        description: Verify packaged dependency files with application egress blocked
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.target == 'win-x64' && 'windows-2025' || 'macos-15' }}
    defaults:
      run:
        shell: ${{ inputs.target == 'win-x64' && 'pwsh' || 'bash' }}
    env:
      DESKTOP_SMOKE_TARGET: ${{ inputs.target }}
      DESKTOP_SMOKE_MODE: ${{ inputs.mode }}
      DSH_TELEMETRY_MODE: DISABLED
      DSH_DESKTOP_DISTRIBUTION_VERSION: startup-replay
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      DSH_STARTUP_DEPENDENCY_AUDIT: ${{ inputs.dependency_audit && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-${{ inputs.target }}
          path: .artifacts/smoke-input
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded Windows app as a standard user
        if: runner.os == 'Windows'
        run: ./apps/desktop/scripts/ci-standard-user-windows.ps1 -Mode ${{ inputs.mode == 'gui' && 'startup' || 'replay' }}
      - name: Prepare macOS replay dependencies
        if: runner.os == 'macOS'
        run: pnpm install --frozen-lockfile
      - name: Verify downloaded macOS app
        if: runner.os == 'macOS'
        run: node apps/desktop/scripts/replay-portable-smoke.mjs
      - name: Upload GUI startup timings and screenshots
        if: always() && runner.os == 'Windows' && inputs.mode == 'gui'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-startup-${{ inputs.target }}
          path: |
            .artifacts/startup-timing/result.json
            .artifacts/startup-timing/*.png
            .artifacts/startup-timing/launch-error.txt
            .artifacts/startup-timing/dependency-audit.json
            .artifacts/startup-timing/network-guard.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload packaged backend ACP evidence
        if: always() && runner.os == 'Windows' && inputs.mode == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-replay-backend-${{ inputs.target }}
          path: .artifacts/acp-windows-smoke/result.json
          include-hidden-files: true
          if-no-files-found: warn
